name: motionfolio

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER:-motionfolio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-motionfolio-local-password}
      POSTGRES_DB: ${DB_NAME:-motionfolio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-motionfolio-local-redis-password}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-motionfolio-local-redis-password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-motionfolio}:${DB_PASSWORD:-motionfolio-local-password}@postgres:5432/${DB_NAME:-motionfolio}?sslmode=disable
      - up
    restart: "no"

  api:
    build:
      context: ./server
    environment:
      SERVER_PORT: "8080"
      SERVER_METRICS_ADDR: 0.0.0.0
      SERVER_METRICS_PORT: "9091"
      SERVER_TRUSTED_PROXIES: 172.16.0.0/12
      GIN_MODE: release
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-motionfolio}
      DB_PASSWORD: ${DB_PASSWORD:-motionfolio-local-password}
      DB_NAME: ${DB_NAME:-motionfolio}
      DB_SSLMODE: disable
      DB_CONN_MAX_LIFETIME: 5m
      DB_CONN_MAX_IDLE_TIME: 3m
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-motionfolio-local-redis-password}
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET:-motionfolio-local-jwt-secret-change-me-0123456789}
      JWT_ACCESS_EXPIRATION: 24h
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      MODERATION_ENABLED: ${MODERATION_ENABLED:-false}
      MODERATION_TIMEOUT: 10s
      MODERATION_WORKER_ENABLED: ${MODERATION_WORKER_ENABLED:-false}
      MODERATION_WORKER_INTERVAL: 5m
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      LOG_LEVEL: info
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_DATA_MODE: api
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./server/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./server/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-motionfolio-local-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./server/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./server/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
